name: Deploy Kenah Wellness production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and upload production site
    runs-on: ubuntu-latest

    steps:
      - name: Get website code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production website
        env:
          VITE_BASE: /
        run: bun run build

      - name: Upload production files to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.PROD_FTP_SERVER }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /
          dangerous-clean-slate: false
