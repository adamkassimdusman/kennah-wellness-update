
name: Validate Kenah Wellness production build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate production files
    runs-on: ubuntu-latest

    steps:
      - name: Get website code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production website
        env:
          VITE_BASE: /
        run: bun run build

      - name: Check build output
        run: |
          test -s dist/index.html
          echo "Production index.html exists."
          find dist -maxdepth 2 -type f | sort | head -60

      - name: Save build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: kenah-wellness-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 3
